    const k=shake(t,tr,.1),e0=E.eyes[0];
    cam={p:[-7.9,key(t,[[S[6],2.5],[tr+.1,3.2]]),.95],q:key(t,[[S[6],[.5,1.2,-.2]],[e0,[2.2,1.3,-.1]],[E.eyes[3],[5.2,2.3,0]],[tr,[9.5,4.3+k,0]],[S[7],[9.8,4.6,0]]]),fov:key(t,[[S[6],44],[S[7],48]]),ap:.02,roll:.03};
    fill.color.set('#c9d4ff');fill.intensity=1.5;
  }else if(si===7){                // 8: лицо «ужас», плашка «БЕГИ!!»
    c.root.position.set(NX,0,-.6);c.root.rotation.y=.25;c.neck.rotation.set(.1,-.2+shake(t,E.horror,.14),0);

  zs.forEach((z,i)=>{z.visible=zOn;if(!zOn)return;const u=(t*.42+i/3)%1,hp=h.root.position;z.position.set(hp.x+.45+.45*u+.07*Math.sin(u*9+i),hp.y+1.9+1.2*u,hp.z+.2);z.scale.setScalar(.2+.34*u);z.material.opacity=Math.sin(PI*u)});
  return cam;
}
// яркость хранителя целиком: 0.05 — силуэт в тени, 1 — полный цвет и горящие глаза
function setLit(G,k){
  if(G.lit===k)return;G.lit=k;
  G.mats.forEach(m=>{m.color.copy(m.userData.c).multiplyScalar(k);m.emissiveIntensity=m.userData.e*k});
  const on=k>.5;G.eyeMat.emissiveIntensity=on?5:0;G.glow.material.opacity=on?.6:0;G.glow.scale.setScalar(on?G.h*.4:.01);G.lamp.intensity=on?1.1*G.h:0;

const R=new THREE.Vector3(),U=new THREE.Vector3(),Q=new THREE.Vector3();

}
// ---------- надписи поверх кадра ----------

    g2.fillStyle=blink?'#e21d2c':'#c3101f';g2.beginPath();g2.roundRect(-238,-64,476,126,20);g2.fill();

// Кадр f из n проб: пробы разнесены по времени (размытие движения) и по диафрагме (размытый фон)
const acc=new Float32Array(W*H*3);
window.capture=(f,n=16,q=.93)=>{
  const tf=f/T.fps;acc.fill(0);
  for(let i=0;i<n;i++){

    view(stage(tf,tf+((i+.5)/n-.5)*.6/T.fps),n>1?r*Math.cos(a):0,n>1?r*Math.sin(a):0);
