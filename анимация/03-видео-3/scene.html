const EZ={io:x=>x*x*(3-2*x),out:x=>1-(1-x)**3,in:x=>x*x*x,lin:x=>x,back:x=>1+3.2*(x-1)**3+2.2*(x-1)**2};
// key(t,[[время,значение,сглаживание],...]) — от позы к позе; повтор значения даёт остановку
function key(t,ks){
  if(t<=ks[0][0])return ks[0][1];
  for(let i=1;i<ks.length;i++)if(t<=ks[i][0]){
    const [t0,v0]=ks[i-1],[t1,v1,e='io']=ks[i],u=EZ[e]((t-t0)/(t1-t0));
    return Array.isArray(v0)?v0.map((v,j)=>v+(v1[j]-v)*u):v0+(v1-v0)*u;
  }
  return ks.at(-1)[1];
}

  const blush=()=>{g.fillStyle='rgba(255,90,120,.45)';for(const x of[52,204]){g.beginPath();g.ellipse(x,Y+34,17,10,0,0,7);g.fill()}};
  const sweat=()=>{g.fillStyle='#7fd0ff';g.beginPath();g.moveTo(222,62);g.quadraticCurveTo(240,96,222,100);g.quadraticCurveTo(204,96,222,62);g.fill()};

    panic(){wide(L,27,6);wide(R,27,6);line(62,74,104,66);line(152,66,194,74);sweat();
      g.strokeStyle=K;g.lineWidth=7;g.beginPath();g.moveTo(94,178);for(let i=1;i<=8;i++)g.lineTo(94+i*8.5,178+(i%2?-8:8));g.stroke()},
    sleep(){shut(L);shut(R);g.fillStyle='#5a1a2a';g.beginPath();g.ellipse(128,180,9,11,0,0,7);g.fill()},

  const fc=document.createElement('canvas');fc.width=fc.height=256;
  const ft=new THREE.CanvasTexture(fc);ft.colorSpace=THREE.SRGBColorSpace;

  let cur;const face=n=>{if(n!==cur){cur=n;drawFace(fc.getContext('2d'),n,p.mom);ft.needsUpdate=true}};
  return {root,body,neck,armL:arm(-1),armR:arm(1),legL:leg(-1),legR:leg(1),face};
}

// ---------- постановка: tf — время кадра (подмена лиц, склейки), t — время пробы (движение) ----------
const LIE=[2.25,1.38,-1.45],HEAD=[2.25,1.86,.43];
function stage(tf,ts){
  const si=S.findLastIndex(s=>tf>=s-1e-6),t=Math.min(Math.max(ts,S[si]),(S[si+1]??T.dur)-1e-4);
  // значения по умолчанию
  for(const c of[kid,mom]){c.root.rotation.set(0,0,0);c.root.scale.set(1,1,1);c.body.rotation.set(0,0,0);c.neck.rotation.set(0,0,0);for(const l of[c.armL,c.armR,c.legL,c.legR])l.rotation.set(0,0,0)}
  monitor.visible=true;mom.root.visible=false;blanket.visible=true;blanket.scale.set(1,1,1);zs.forEach(z=>z.visible=false);
  fill.intensity=0;spot.intensity=0;mon.intensity=14+2*Math.sin(t*17)+1.5*Math.sin(t*41);
  door.rotation.y=-key(t,[[0,0],[E.creak,0],[2.05,.42,'out'],[2.5,.46],[3.5,1.08],[E.doorClose,1.08],[E.doorClose+.38,.3],[99,.3]]);
  chair.rotation.y=t<E.zip+.08?.06*Math.sin(t*3):9*(1-Math.exp(-(t-E.zip-.08)/1.7));
  // сын в кровати (по умолчанию для всех планов после первого)
  kid.root.position.set(...LIE);kid.root.rotation.set(PI/2,PI,0);
  blanket.scale.y=1+.035*Math.sin(t*2.6);
  kid.face(tf<E.panic?'happy':tf<S[1]?'panic':tf<E.eye?'sleep':tf<E.grin?'peek':tf<E.horror?'grin':'horror');
  // мама
  mom.root.position.set(...key(t,[[2.5,[-1.4,0,-4.5]],[3.4,[-1.4,0,-3.62],'out'],[E.doorClose-.05,[-1.4,0,-3.62]],[E.doorClose+.3,[-1.4,0,-4.6]],[S[5]-.01,[-1.4,0,-4.6]],[S[5],[-1.3,0,-4.2],'lin']]));
  mom.face(tf<S[3]?'susp':tf<6.62?'lookL':tf<6.98?'lookR':tf<S[5]?'hmph':'glare');
  let cam;
  if(si===0){                      // 1: за компьютером
    monitor.visible=false;blanket.visible=false;
    const p=E.panic,z=E.zip;
    kid.root.position.set(key(t,[[z,.6],[z+.09,.42,'out'],[z+.26,7,'in']]),.05,1.05);
    kid.root.rotation.set(0,0,key(t,[[z,0],[z+.09,.28,'out'],[z+.2,-.55]]));
    kid.legL.rotation.x=kid.legR.rotation.x=-PI/2;
    const calm=t<p;
    kid.body.rotation.x=key(t,[[p,.1],[p+.1,-.16,'back'],[z,-.14]])+(calm?.02*Math.sin(t*22):0);
    kid.neck.rotation.x=calm?-.06+.04*Math.sin(t*11):key(t,[[p,-.06],[p+.08,-.14,'out']]);
    kid.neck.rotation.z=calm?.06*Math.sin(t*5.5):0;
    kid.armL.rotation.x=calm?-1.2+.16*Math.sin(t*46):key(t,[[p,-1.2],[p+.1,-2.0,'back']]);
    kid.armR.rotation.x=calm?-1.2+.16*Math.cos(t*39):key(t,[[p,-1.2],[p+.1,-2.1,'back']]);
    kid.armL.rotation.z=calm?0:-.45;kid.armR.rotation.z=calm?0:.45;
    kid.root.position.y+=calm?.012*Math.abs(Math.sin(t*23)):0;
    cam={p:key(t,[[0,[.2,1.85,3.7]],[2.5,[.15,1.85,3.55],'lin']]),q:[.32,1.9,.7],fov:60,ap:.03,roll:-.05};mon.intensity*=.08;
    fill.color.set('#fff1e2');fill.intensity=1.0;
  }else if(si===1){                // 2: мама заглядывает
    mom.root.visible=true;
    const l=key(t,[[2.5,0],[3.4,1,'out']]);
    mom.body.rotation.x=.45*l;mom.neck.rotation.set(-.25*l,.4*l+.05*Math.sin(t*2),-.12*l);
    cam={p:key(t,[[2.5,[.7,2.0,-.2]],[4.2,[.5,2.05,-.6],'lin']]),q:[-1.35,2.3,-3.0],fov:40,ap:.035,roll:.07};
    fill.color.set('#e6ecff');fill.intensity=1.3;
  }else if(si===2){                // 3: общий план, «спит»
    mom.root.visible=true;mom.body.rotation.x=.45;mom.neck.rotation.x=-.25;
    cam={p:[-.9,4.1,-2.3],q:key(t,[[4.2,[1.5,1.0,.3]],[6.2,[1.8,1.0,.3]]]),fov:62,ap:.02,roll:0};
    fill.color.set('#e0e6ff');fill.intensity=.9;
  }else if(si===3){                // 4: мама осматривается и уходит
    mom.root.visible=true;
    const out=key(t,[[E.doorClose-.05,1],[E.doorClose+.25,0]]);
    mom.body.rotation.x=.45*out;
    mom.neck.rotation.set(-.25*out,key(t,[[6.2,.55],[6.55,.55],[6.68,-.5,'out'],[6.95,-.5],[7.05,0,'out']]),0);
    cam={p:[-.6,1.0,-1.3],q:[-1.4,2.3,-3.0],fov:44,ap:.03,roll:-.08};
    fill.color.set('#e6ecff');fill.intensity=1.3;
  }else if(si===4||si===6){        // 5 и 7: лицо сына на подушке
    const h=si===6,e=E.eye;
    kid.neck.rotation.set(h?.2:0,key(t,[[e,0],[e+.1,-.22,'back'],[E.grin,-.22],[E.grin+.12,-.3]])+(h?.25+shake(t,E.horror,.12):0),0);
    if(h){blanket.position.z=-1.05;blanket.scale.set(1,1.05,1)}else blanket.position.z=-1.2;
    cam=h?{p:key(t,[[10.6,[1.9,3.7,.95]],[11.5,[1.95,3.45,.9],'out']]),q:[2.25,1.9,.32],fov:46,ap:.03,roll:.12,up:[0,.2,1]}
         :{p:key(t,[[7.6,[1.95,3.95,.7]],[9.6,[2.0,3.65,.65],'lin']]),q:[2.25,1.86,.43],fov:40,ap:.03,roll:-.1,up:[0,.2,1]};
    fill.color.set('#e0e6ff');fill.intensity=h?1.0:1.3;
    if(h){spot.color.set('#ffb65c');spot.intensity=40;spot.angle=.16;spot.position.set(-1.2,2.4,-3.6);spot.target.position.set(2.25,1.5,.45)}
  }else{                           // 6: глаз в щели
    mom.root.visible=true;mom.neck.rotation.set(0,.54,0);
    const k=shake(t,E.boom,.05);
    cam={p:[1.14+k,1.9,.1],q:[-1.15,2.4+k,-3.72],fov:key(t,[[9.6,26],[10.6,16,'out']]),ap:.012,roll:.1};
    fill.color.set('#ffd0d6');fill.intensity=.6;
    spot.color.set('#bfe9ff');spot.intensity=18;spot.angle=.2;spot.position.set(1.0,2.0,-.2);spot.target.position.set(-1.15,2.4,-3.72);
  }
  // буквы Z, пока «спит»
  if((si===2||si===4)&&tf<E.eye)zs.forEach((z,i)=>{const u=(t*.55+i/3)%1;z.visible=true;z.position.set(HEAD[0]-.5-.5*u+.08*Math.sin(u*9+i),HEAD[1]+.5+1.3*u,HEAD[2]+.25-.3*u);z.scale.setScalar(.22+.4*u);z.material.opacity=Math.sin(PI*u)});

}
const R=new THREE.Vector3(),U=new THREE.Vector3(),Q=new THREE.Vector3();
function view(c,dx,dy){
  camera.fov=c.fov;camera.updateProjectionMatrix();camera.up.set(...(c.up||[0,1,0]));
  camera.position.set(...c.p);Q.set(...c.q);camera.lookAt(Q);camera.updateMatrixWorld();
  R.setFromMatrixColumn(camera.matrixWorld,0);U.setFromMatrixColumn(camera.matrixWorld,1);
  camera.position.addScaledVector(R,dx*c.ap).addScaledVector(U,dy*c.ap);camera.lookAt(Q);camera.rotateZ(c.roll||0);   // сдвиг по диафрагме: резкость в точке q
  fill.position.copy(camera.position).addScaledVector(R,-2).addScaledVector(U,2.5);fill.target.position.copy(Q);
}
function caption(){
  g2.font='900 62px "Arial Black",Arial';g2.textAlign='center';g2.lineJoin='round';g2.lineWidth=14;g2.strokeStyle='#000';
  CAPTION.forEach((s,i)=>{const y=300+i*78;g2.strokeText(s,W/2,y);g2.fillStyle=i?'#ff2b2b':'#fff';g2.fillText(s,W/2,y)});
}
// Кадр f из n проб: пробы разнесены по времени (размытие движения) и по диафрагме (размытый фон)
const acc=new Float32Array(W*H*3);
window.capture=(f,n=16,q=.93)=>{
  const tf=f/T.fps;acc.fill(0);
  for(let i=0;i<n;i++){
    const r=Math.sqrt((i+.5)/n),a=i*2.39996;
    view(stage(tf,tf+((i+.5)/n-.5)*.6/T.fps),n>1?r*Math.cos(a):0,n>1?r*Math.sin(a):0);
    renderer.render(scene,camera);g2.drawImage(renderer.domElement,0,0);
    const d=g2.getImageData(0,0,W,H).data;for(let j=0,k=0;j<d.length;j+=4,k+=3){acc[k]+=d[j];acc[k+1]+=d[j+1];acc[k+2]+=d[j+2]}
  }
  const im=g2.createImageData(W,H),d=im.data;for(let j=0,k=0;j<d.length;j+=4,k+=3){d[j]=acc[k]/n;d[j+1]=acc[k+1]/n;d[j+2]=acc[k+2]/n;d[j+3]=255}
  g2.putImageData(im,0,0);
  const v=g2.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,10,0)');v.addColorStop(1,'rgba(0,0,10,.5)');g2.fillStyle=v;g2.fillRect(0,0,W,H);
  caption();
  return out.toDataURL('image/jpeg',q).split(',')[1];
};
